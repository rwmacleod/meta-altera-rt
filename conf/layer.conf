# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "altera-rt-layer"
BBFILE_PATTERN_altera-rt-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_altera-rt-layer = "10"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_altera-rt-layer = "1"
LAYERSERIES_COMPAT_altera-rt-layer = "scarthgap walnascar"
LAYERDEPENDS_altera-rt-layer = " \
    altera-bsp \
"

ERROR_QA:remove:pn-linux-socfpga-rt = "patch-status"
ERROR_QA:remove:pn-linux-socfpga-lts = "patch-status"
